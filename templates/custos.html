<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="/static/chart.umd.min.js"></script>
<script>
  // Fallback: se o arquivo local não carregar (404/rede), busca do CDN.
  if (typeof Chart === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"><\/script>');
  }
</script>
<style>
:root {
  --teal:    #3BB5A3;
  --cyan:    #00B2C9;
  --green:   #007C6B;
  --orange:  #EB600A;
  --amber:   #F3A133;
  --dark:    #38464D;
  --blue2:   #2E758C;
  --teal2:   #0F9688;
  --peach:   #F7975B;
  --sky:     #53B7D9;
  --bg:      #f0f4f5;
  --card:    #ffffff;
  --border:  #dde4e6;
  --muted:   #6b7f86;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--dark);
  min-height: 100vh;
}

header {
  background: #ffffff;
  padding: .6rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--teal);
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  gap: 1rem;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: .85rem;
  min-width: 0;
}
.header-logo {
  height: 72px;
  width: auto;
  object-fit: contain;
  border-radius: 6px;
  flex-shrink: 0;
}
header h1 {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--dark);
  letter-spacing: .04em;
  text-transform: uppercase;
}
header span {
  font-size: .75rem;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* ---- Loader overlay ---- */
#loader-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(38,50,56,.45);
  backdrop-filter: blur(2px);
  align-items: center;
  justify-content: center;
}
#loader-overlay.active { display: flex; }
.loader-ring {
  position: relative;
  width: 200px;
  height: 200px;
}
.loader-ring svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: spin 1.1s linear infinite;
}
.loader-ring svg circle {
  fill: none;
  stroke: var(--teal);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 200;
  stroke-dashoffset: 50;
}
.loader-ring img {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 150px;
  height: 150px;
  object-fit: contain;
  border-radius: 50%;
  background: #fff;
  padding: 6px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.wrapper { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem; }

.filters {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.25rem 1.5rem;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
  align-items: end;
  margin-bottom: 1.5rem;
}
.filters label {
  display: block;
  font-size: .72rem;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: .35rem;
}
.filters input, .filters select {
  width: 100%;
  padding: .5rem .75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: .875rem;
  color: var(--dark);
  background: var(--bg);
  outline: none;
  transition: border .15s;
}
.filters input:focus, .filters select:focus {
  border-color: var(--teal);
}
.clinica-dropdown {
  position: relative;
}
.clinica-btn {
  width: 100%;
  padding: .5rem .75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  font-family: inherit;
  font-size: .875rem;
  color: var(--dark);
  cursor: pointer;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .5rem;
  transition: border .15s;
}
.clinica-btn:focus, .clinica-btn:hover { border-color: var(--teal); outline: none; }
.clinica-btn .arrow { font-size: .65rem; transition: transform .2s; }
.clinica-btn.open .arrow { transform: rotate(180deg); }
.clinica-panel {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: auto;
  z-index: 200;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  min-width: 220px;
  padding: .5rem;
}
.clinica-panel.open { display: block; }
.clinica-list {
  max-height: 220px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: .15rem;
  margin-top: .3rem;
}
.clinica-list label {
  display: flex;
  align-items: center;
  gap: .4rem;
  font-size: .82rem;
  font-weight: 400;
  color: var(--dark);
  text-transform: none;
  letter-spacing: 0;
  margin-bottom: 0;
  cursor: pointer;
  padding: .15rem .3rem;
  border-radius: 4px;
  white-space: nowrap;
}
.clinica-list label:hover { background: rgba(59,181,163,.1); }
.clinica-list input[type=checkbox] { accent-color: var(--teal); cursor: pointer; }
.clinica-toggle-all {
  font-size: .68rem;
  color: var(--teal);
  cursor: pointer;
  text-decoration: underline;
  background: none;
  border: none;
  padding: 0;
  font-family: inherit;
  text-align: left;
  display: block;
}
.btn-apply {
  padding: .55rem 1.4rem;
  background: var(--teal);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-family: 'Syne', sans-serif;
  font-size: .82rem;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background .15s, transform .1s;
  white-space: nowrap;
}
.btn-apply:hover { background: var(--green); transform: translateY(-1px); }

.kpis {
  display: grid;
  grid-template-columns: repeat(5, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.kpi {
  border-radius: 10px;
  padding: 1.5rem 1.75rem;
  min-height: 160px;
  position: relative;
  overflow: hidden;
  transition: transform .2s;
}
.kpi:hover { transform: translateY(-3px); }
.kpi::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  border-radius: 0 0 0 80px;
  opacity: .15;
  background: #fff;
}
.kpi .label {
  font-size: .6rem;
  font-weight: 500;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: rgba(255,255,255,.8);
  margin-bottom: .6rem;
}
.kpi .value {
  font-family: 'Syne', sans-serif;
  font-size: 2rem;
  font-weight: 800;
  color: #fff;
  line-height: 1.1;
}
.kpi .unit {
  font-size: .82rem;
  color: rgba(255,255,255,.65);
  margin-top: .4rem;
  font-weight: 400;
}
.kpi .detail {
  font-size: .72rem;
  color: rgba(255,255,255,.9);
  margin-top: .45rem;
  line-height: 1.35;
  max-height: 70px;
  overflow: auto;
  padding-right: .2rem;
}
.kpi .icon {
  position: absolute;
  right: 1.25rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 2rem;
  opacity: .25;
}

.c1 { background: var(--sky); }
.c2 { background: var(--cyan); }
.c3 { background: var(--blue2); }
.c4 { background: var(--teal); }
.c5 { background: var(--teal2); }
.c6 { background: var(--green); }
.c7 { background: var(--muted); }
.c8 { background: var(--dark); }
.c9 { background: var(--peach); }
.c10 { background: var(--orange); }
.c11 { background: var(--amber); }

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--dark);
  margin-top: 2rem;
  margin-bottom: 1rem;
  border-bottom: 2px solid var(--teal);
  padding-bottom: .5rem;
}

.kpi-hover-detail {
  font-size: .72rem;
  color: rgba(255,255,255,.9);
  margin-top: .45rem;
  line-height: 1.5;
  max-height: 0;
  overflow: hidden;
  transition: max-height .35s ease;
}
.kpi:hover .kpi-hover-detail {
  max-height: 200px;
  overflow-y: auto;
}

.loading { opacity: .4; }
.error-bar {
  background: #fde;
  border: 1px solid #f99;
  color: #c00;
  border-radius: 8px;
  padding: .75rem 1rem;
  font-size: .85rem;
  margin-bottom: 1rem;
  display: none;
}

/* ---- Gráficos (mesmo padrão da página da Emergência) ---- */
.graf-resumo { font-size: .85rem; color: var(--muted); margin-bottom: 1rem; }
.graf-resumo b { color: var(--dark); font-family: 'Syne', sans-serif; font-size: 1rem; }
.graf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.graf-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.1rem 1.25rem;
  min-width: 0;
}
.graf-card.full { grid-column: 1 / -1; }
.graf-card h3 {
  font-family: 'Syne', sans-serif;
  font-size: .9rem;
  font-weight: 700;
  color: var(--dark);
  margin-bottom: .75rem;
}
.graf-card .nota { font-size: .72rem; color: var(--muted); margin-top: .5rem; }
.chart-box { position: relative; height: 300px; }

@media(max-width:900px){
  .kpis { grid-template-columns: repeat(2, minmax(200px, 1fr)); }
  .graf-grid { grid-template-columns: 1fr; }
}

@media(max-width:600px){
  .wrapper{padding:1rem;}
  .kpi .value{font-size:1.5rem;}
  header h1{font-size:.9rem;}
  .kpis { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="loader-overlay">
  <div class="loader-ring">
    <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40"/></svg>
    <img src="/static/LOGO HM - NOVA (1).png" alt="Carregando...">
  </div>
</div>

<header>
  <div class="header-brand">
    <img class="header-logo" src="/static/LOGO HM E SESA - NOVA (1).png" alt="logo">
    <h1>Custos</h1>
  </div>
  <span>Painel de Gestão</span>
  <div style="display:flex;align-items:center;gap:1rem;">
    <button id="btn-voltar-inicio" style="font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--teal);color:#fff;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;transition:background .15s;white-space:nowrap;" onmouseover="this.style.background='var(--green)'" onmouseout="this.style.background='var(--teal)'">Voltar</button>
  </div>
</header>

<div class="wrapper">

  <div class="filters">
    <div>
      <label for="mes_ini">Mês Inicial</label>
      <select id="mes_ini"></select>
    </div>
    <div>
      <label for="mes_fim">Mês Final</label>
      <select id="mes_fim"></select>
    </div>
    <div>
      <label for="tipo">Tipo de Custo</label>
      <select id="tipo"><option value="">Todos</option></select>
    </div>
    <div>
      <label for="item">Item de Custo</label>
      <select id="item"><option value="">Todos</option></select>
    </div>
    <div>
      <label>&nbsp;</label>
      <button class="btn-apply" onclick="carregar()">Atualizar</button>
    </div>
  </div>

  <div class="error-bar" id="erro"></div>

  <div id="kpis">
    <h2 class="section-title">Custos do Hospital</h2>
    <div class="kpis">
      <div class="kpi c2">
        <div class="label">Custo Total</div>
        <div class="value" id="k_total">—</div>
        <div class="unit" id="k_total_sub">no período</div>
        <div class="icon">💰</div>
      </div>
      <div class="kpi c3">
        <div class="label">Média Mensal</div>
        <div class="value" id="k_media">—</div>
        <div class="unit" id="k_mediana">—</div>
        <div class="icon">📅</div>
      </div>
      <div class="kpi c9">
        <div class="label">Mês de Maior Custo</div>
        <div class="value" id="k_maior_mes">—</div>
        <div class="unit" id="k_maior_mes_valor">—</div>
        <div class="icon">📈</div>
      </div>
      <div class="kpi c6">
        <div class="label">Maior Tipo de Custo</div>
        <div class="value" id="k_maior_tipo" style="font-size:1.25rem;">—</div>
        <div class="unit" id="k_maior_tipo_valor">—</div>
        <div class="icon">🏷️</div>
      </div>
    </div>
  </div>

  <div id="graficos">
    <h2 class="section-title">Gráficos</h2>
    <div class="graf-grid">
      <div class="graf-card full">
        <h3>Custo por mês (por tipo de custo)</h3>
        <div class="chart-box"><canvas id="chart_mes"></canvas></div>
      </div>
      <div class="graf-card full">
        <h3>Custo por tipo</h3>
        <div class="chart-box" id="box_tipo" style="height:220px;"><canvas id="chart_tipo"></canvas></div>
      </div>
      <div class="graf-card full">
        <h3>Custo por item</h3>
        <div class="chart-box" id="box_item"><canvas id="chart_item"></canvas></div>
      </div>
    </div>
  </div>

</div>

<script>
function showLoader() { document.getElementById('loader-overlay').classList.add('active'); }
function hideLoader() { document.getElementById('loader-overlay').classList.remove('active'); }

document.getElementById('btn-voltar-inicio').addEventListener('click', function() {
  showLoader();
  setTimeout(function() { window.location.href = '/'; }, 300);
});

function v(id) { return document.getElementById(id).value; }
const moeda = n => (n === null || n === undefined) ? '—'
  : Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
// valores grandes nos rótulos do gráfico: R$ 12,3 mi / R$ 950 mil
const moedaCurta = n => {
  if (n === null || n === undefined) return '—';
  const a = Math.abs(n);
  if (a >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (a >= 1e3) return 'R$ ' + (n / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil';
  return moeda(n);
};
const PALETA = ['#00A1A2', '#EB600A', '#00B2C9', '#007C6B', '#F3A133', '#3BB5A3', '#2E758C', '#F7975B', '#0F9688', '#53B7D9'];
const charts = {};
function novoGrafico(id, config) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), config);
}

// Escreve o total de cada mês em cima da linha de total
const pluginRotuloTotal = {
  id: 'rotuloTotal',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.data.datasets.forEach((ds, i) => {
      if (ds.type !== 'line' || chart.getDatasetMeta(i).hidden) return;
      ctx.save();
      ctx.font = 'bold 11px "DM Sans", sans-serif';
      ctx.fillStyle = '#38464D';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      chart.getDatasetMeta(i).data.forEach((el, j) => {
        if (ds.data[j]) ctx.fillText(moedaCurta(ds.data[j]), el.x, el.y - 6);
      });
      ctx.restore();
    });
  }
};

function preencherSelect(id, opcoes, rotuloTodos, rotulo = o => o) {
  const sel = document.getElementById(id);
  const atual = sel.value;
  sel.innerHTML = rotuloTodos !== null ? `<option value="">${rotuloTodos}</option>` : '';
  opcoes.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = rotulo(o);
    sel.appendChild(opt);
  });
  if (opcoes.includes(atual)) sel.value = atual;
}

function barrasHorizontais(id, boxId, itens, cor) {
  document.getElementById(boxId).style.height = Math.max(160, itens.length * 24 + 40) + 'px';
  novoGrafico(id, {
    type: 'bar',
    data: {
      labels: itens.map(x => x.nome),
      datasets: [{ label: 'Custo', data: itens.map(x => x.valor),
                   backgroundColor: itens.map((_, i) => (cor || PALETA[i % PALETA.length]) + 'cc'),
                   borderColor: itens.map((_, i) => cor || PALETA[i % PALETA.length]), borderWidth: 1, borderRadius: 3 }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + moeda(ctx.parsed.x) } } },
      scales: { x: { beginAtZero: true, ticks: { callback: val => moedaCurta(val) } },
                y: { ticks: { autoSkip: false, font: { size: 11 } } } }
    }
  });
}

function render(d) {
  const k = d.kpis;
  document.getElementById('k_total').textContent = moedaCurta(k.total);
  document.getElementById('k_total_sub').textContent = moeda(k.total);
  document.getElementById('k_media').textContent = moedaCurta(k.media_mensal);
  document.getElementById('k_mediana').textContent = `mediana: ${moedaCurta(k.mediana_mensal)} · ${k.meses_com_dado} meses`;
  document.getElementById('k_maior_mes').textContent = k.maior_mes || '—';
  document.getElementById('k_maior_mes_valor').textContent = moeda(k.maior_mes_valor);
  document.getElementById('k_maior_tipo').textContent = k.maior_tipo || '—';
  document.getElementById('k_maior_tipo_valor').textContent = moeda(k.maior_tipo_valor);

  novoGrafico('chart_mes', {
    type: 'bar',
    data: {
      labels: d.meses,
      datasets: [
        ...d.por_mes_tipo.map((s, i) => ({
          label: s.tipo, data: s.valores, stack: 'custo', order: 2,
          backgroundColor: PALETA[i % PALETA.length] + 'cc', borderColor: PALETA[i % PALETA.length], borderWidth: 1
        })),
        { type: 'line', label: 'Total', data: d.total_mes, stack: 'total', order: 1,
          borderColor: '#38464D', backgroundColor: '#38464D', borderWidth: 2, pointRadius: 3, fill: false }
      ]
    },
    plugins: [pluginRotuloTotal],
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: true, position: 'bottom', labels: { usePointStyle: true, padding: 15 } },
        tooltip: {
          filter: item => item.dataset.type !== 'line',
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${moeda(ctx.parsed.y)}`,
            footer: items => 'Total: ' + moeda(items.reduce((s, i) => s + (i.parsed.y || 0), 0))
          }
        }
      },
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true, suggestedMax: Math.max(1, ...d.total_mes) * 1.12,
             ticks: { callback: val => moedaCurta(val) } }
      }
    }
  });

  barrasHorizontais('chart_tipo', 'box_tipo', d.por_tipo);
  barrasHorizontais('chart_item', 'box_item', d.por_item, '#2E758C');
}

let primeiraCarga = true;
function carregar() {
  const params = new URLSearchParams({ mes_ini: v('mes_ini'), mes_fim: v('mes_fim'), tipo: v('tipo'), item: v('item') });
  document.getElementById('erro').style.display = 'none';
  ['kpis', 'graficos'].forEach(id => document.getElementById(id).classList.add('loading'));
  showLoader();
  fetch('/api/custos/dados?' + params)
    .then(r => r.json())
    .then(res => {
      hideLoader();
      ['kpis', 'graficos'].forEach(id => document.getElementById(id).classList.remove('loading'));
      if (!res.ok) throw new Error(res.erro);
      const d = res.dados;
      if (d.vazio) { throw new Error('Nenhum custo lançado ainda.'); }
      const rotuloMes = m => `${m.slice(5)}/${m.slice(0, 4)}`;
      if (primeiraCarga) {
        preencherSelect('mes_ini', d.meses_disponiveis, null, rotuloMes);
        preencherSelect('mes_fim', d.meses_disponiveis, null, rotuloMes);
        primeiraCarga = false;
      }
      document.getElementById('mes_ini').value = d.mes_ini;
      document.getElementById('mes_fim').value = d.mes_fim;
      preencherSelect('tipo', d.opcoes.tipos, 'Todos');
      preencherSelect('item', d.opcoes.itens, 'Todos');
      render(d);
    })
    .catch(err => {
      hideLoader();
      ['kpis', 'graficos'].forEach(id => document.getElementById(id).classList.remove('loading'));
      document.getElementById('erro').textContent = 'Erro: ' + err.message;
      document.getElementById('erro').style.display = 'block';
    });
}

// tipo e item filtram na hora; trocar o tipo limpa o item
document.getElementById('tipo').addEventListener('change', () => { document.getElementById('item').value = ''; carregar(); });
document.getElementById('item').addEventListener('change', carregar);

carregar();
</script>
</body>
</html>
