{%- from '_layout.html' import recursos, cabecalho, rodape -%}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    {{ recursos() }}
</head>
<body class="pg-login">
    {{ cabecalho('Área Restrita', 'Acesso ao painel', voltar=False) }}

    <main class="main-content">
        <div class="deco deco-1"></div>
        <div class="deco deco-2"></div>

        <form class="login-card" method="post" action="{{ url_for('login') }}">
            <h1>Login</h1>
            {% if erro %}<div class="erro" role="alert">{{ erro }}</div>{% endif %}
            <input type="hidden" name="proximo" value="{{ proximo }}">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            <div class="acoes">
                <a href="{{ url_for('index') }}" class="voltar">← Voltar ao painel</a>
                <button type="submit">Entrar</button>
            </div>
        </form>

    </main>
    {{ rodape() }}
</body>
</html>
