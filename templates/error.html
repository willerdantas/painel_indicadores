{%- from '_layout.html' import recursos, cabecalho, rodape -%}
<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Erro</title>
        {{ recursos() }}
</head>
    <body class="pg-error">
        {{ cabecalho('Ocorreu um erro', voltar=False) }}
        <div class="container">
            <h1>Ocorreu um erro</h1>
            <p>{{ message }}</p>
            <a href="{{ url_for('index') }}">Voltar para a página inicial</a>
        </div>
        {{ rodape() }}
</body>
</html>
