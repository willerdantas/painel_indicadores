<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores Hospitalares — Comparativo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #3BB5A3; --cyan: #00B2C9; --green: #007C6B; --orange: #EB600A;
  --amber: #F3A133; --dark: #38464D; --blue2: #2E758C; --teal2: #0F9688;
  --peach: #F7975B; --sky: #53B7D9; --bg: #f0f4f5; --card: #ffffff;
  --border: #dde4e6; --muted: #6b7f86; --up: #0F9688; --down: #EB600A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }
header {
  background: #ffffff;
  padding: .6rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--teal);
  box-shadow: 0 2px 8px rgba(0,0,0,.07);
  gap: 1rem;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: .85rem;
  min-width: 0;
}
.header-logo {
  height: 72px;
  width: auto;
  object-fit: contain;
  border-radius: 6px;
  flex-shrink: 0;
}
header h1 {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--dark);
  letter-spacing: .04em;
  text-transform: uppercase;
}
header span {
  font-size: .75rem;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.wrapper { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem; }
.filters {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; align-items: end;
  margin-bottom: 1.5rem;
}
.filters label { display: block; font-size: .72rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .35rem; }
.filters input, .filters select {
  width: 100%; padding: .5rem .75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;
  font-size: .875rem; color: var(--dark); background: var(--bg); outline: none; transition: border .15s;
}
.filters input:focus, .filters select:focus { border-color: var(--teal); }
.btn-apply {
  padding: .55rem 1.4rem; background: var(--teal); color: #fff; border: none; border-radius: 6px;
  font-family: 'Syne', sans-serif; font-size: .82rem; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; cursor: pointer; transition: background .15s, transform .1s; white-space: nowrap;
}
.btn-apply:hover { background: var(--green); transform: translateY(-1px); }
.section-title { font-family: 'Syne', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--dark); margin-top: 2rem; margin-bottom: 1rem; border-bottom: 2px solid var(--teal); padding-bottom: .5rem; }
.error-bar { background: #fde; border: 1px solid #f99; color: #c00; border-radius: 8px; padding: .75rem 1rem; font-size: .85rem; margin-bottom: 1rem; display: none; }

.tabela-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 4px rgba(0,0,0,.05); overflow-x: auto; }
table.comparativo { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.comparativo th, table.comparativo td { padding: .7rem .9rem; text-align: left; border-bottom: 1px solid var(--border); }
table.comparativo th {
  font-family: 'Syne', sans-serif; font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); background: var(--bg);
}
table.comparativo th.num, table.comparativo td.num { text-align: right; }
table.comparativo tr:last-child td { border-bottom: none; }
table.comparativo tr:hover td { background: rgba(59,181,163,.06); }
.indicador-nome { font-weight: 600; color: var(--dark); }
.unidade { color: var(--muted); font-size: .76rem; }
.variacao { font-weight: 700; display: inline-flex; align-items: center; gap: .3rem; }
.variacao.up { color: var(--up); }
.variacao.down { color: var(--down); }
.variacao.flat { color: var(--muted); }
.sem-dado { color: var(--muted); font-style: italic; }
#loader-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(38,50,56,.45); backdrop-filter: blur(2px); align-items: center; justify-content: center; }
#loader-overlay.active { display: flex; }
.loader-ring { position: relative; width: 160px; height: 160px; }
.loader-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 1.1s linear infinite; }
.loader-ring svg circle { fill: none; stroke: var(--teal); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 200; stroke-dashoffset: 50; }
.loader-ring img { position: absolute; inset: 0; margin: auto; width: 120px; height: 120px; object-fit: contain; border-radius: 50%; background: #fff; padding: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media(max-width:600px){ .wrapper { padding: 1rem; } header h1 { font-size: .85rem; } }
</style>
</head>
<body>

<div id="loader-overlay">
  <div class="loader-ring">
    <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40"/></svg>
    <img src="/static/LOGO HM - NOVA (1).png" alt="Carregando...">
  </div>
</div>

<header>
  <div class="header-brand">
    <img class="header-logo" src="/static/LOGO HM E SESA - NOVA (1).png" alt="logo">
    <h1>Indicadores Hospitalares</h1>
  </div>
  <span>Painel de Gestão</span>
  <div style="display:flex;align-items:center;gap:1rem;">
    <a href="/hcasg/hospitalares/tendencia" style="font-size:.78rem;color:var(--teal);text-decoration:none;font-weight:600;letter-spacing:.04em;">📈 Tendência Mensal</a>
    <a href="/hcasg/hospitalares" style="font-size:.78rem;color:var(--teal);text-decoration:none;font-weight:600;letter-spacing:.04em;">🗂️ Indicadores</a>
    <button id="btn-voltar-inicio" style="font-family:'Syne',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--teal);color:#fff;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;transition:background .15s;white-space:nowrap;" onmouseover="this.style.background='var(--green)'" onmouseout="this.style.background='var(--teal)'">Voltar</button>
  </div>
</header>

<div class="wrapper">

  <div class="filters">
    <div>
      <label>Clínica</label>
      <select id="clinica">
        <option value="">Todas</option>
        {% for c in clinicas %}<option>{{ c }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Enfermaria</label>
      <select id="enfermaria">
        <option value="">Todas</option>
        {% for e in enfermarias %}<option>{{ e }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Leito</label>
      <select id="leito">
        <option value="">Todos</option>
        {% for l in leitos %}<option>{{ l }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Mês A</label>
      <input type="month" id="mes_a" value="{{ mes_a }}">
    </div>
    <div>
      <label>Mês B</label>
      <input type="month" id="mes_b" value="{{ mes_b }}">
    </div>
    <div>
      <label>&nbsp;</label>
      <button class="btn-apply" onclick="carregarComparativo()">Comparar</button>
    </div>
  </div>

  <div class="error-bar" id="erro"></div>

  <h2 class="section-title" id="titulo-tabela">Comparativo</h2>
  <div class="tabela-card">
    <table class="comparativo">
      <thead>
        <tr>
          <th>Indicador</th>
          <th class="num" id="th-mes-a">Mês A</th>
          <th class="num" id="th-mes-b">Mês B</th>
          <th class="num">Variação</th>
        </tr>
      </thead>
      <tbody id="tbody-comparativo">
        <tr><td colspan="4" class="sem-dado">Selecione os dois meses e clique em Comparar.</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
function showLoader() { document.getElementById('loader-overlay').classList.add('active'); }
function hideLoader() { document.getElementById('loader-overlay').classList.remove('active'); }

document.getElementById('btn-voltar-inicio').addEventListener('click', function() {
  showLoader();
  setTimeout(function() { window.location.href = '/'; }, 300);
});

function v(id){ return document.getElementById(id).value; }

function formatarValor(valor, unidade) {
  if (valor === null || valor === undefined) return '<span class="sem-dado">—</span>';
  const num = Number(valor);
  const casas = Number.isInteger(num) ? 0 : 2;
  return `${num.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: casas })} ${unidade || ''}`.trim();
}

function formatarVariacao(variacao) {
  if (variacao === null || variacao === undefined) return '<span class="sem-dado">—</span>';
  const num = Number(variacao);
  if (num > 0) {
    return `<span class="variacao up">▲ ${num.toFixed(2)}%</span>`;
  } else if (num < 0) {
    return `<span class="variacao down">▼ ${Math.abs(num).toFixed(2)}%</span>`;
  }
  return `<span class="variacao flat">= 0,00%</span>`;
}

function carregarComparativo() {
  const mesA = v('mes_a');
  const mesB = v('mes_b');
  const erroEl = document.getElementById('erro');
  erroEl.style.display = 'none';

  if (!mesA || !mesB) {
    erroEl.textContent = 'Selecione os dois meses para comparar.';
    erroEl.style.display = 'block';
    return;
  }

  const params = new URLSearchParams({
    clinica: v('clinica'), enfermaria: v('enfermaria'), leito: v('leito'),
    mes_a: mesA, mes_b: mesB
  });

  showLoader();
  fetch('/api/hcasg/hospitalares/comparativo?' + params)
    .then(r => r.json())
    .then(res => {
      hideLoader();
      if (!res.ok) {
        erroEl.textContent = 'Erro: ' + res.erro;
        erroEl.style.display = 'block';
        return;
      }
      document.getElementById('titulo-tabela').textContent =
        `Comparativo — ${res.mes_a_label} vs ${res.mes_b_label}`;
      document.getElementById('th-mes-a').textContent = res.mes_a_label;
      document.getElementById('th-mes-b').textContent = res.mes_b_label;

      const tbody = document.getElementById('tbody-comparativo');
      if (!res.linhas || res.linhas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="sem-dado">Sem dados para os meses selecionados.</td></tr>';
        return;
      }
      tbody.innerHTML = res.linhas.map(l => `
        <tr>
          <td>
            <div class="indicador-nome">${l.indicador}</div>
            ${l.unidade ? `<div class="unidade">${l.unidade}</div>` : ''}
          </td>
          <td class="num">${formatarValor(l.valor_a, l.unidade === '%' ? '%' : '')}</td>
          <td class="num">${formatarValor(l.valor_b, l.unidade === '%' ? '%' : '')}</td>
          <td class="num">${formatarVariacao(l.variacao)}</td>
        </tr>
      `).join('');
    })
    .catch(err => {
      hideLoader();
      erroEl.textContent = 'Falha na requisição: ' + err;
      erroEl.style.display = 'block';
    });
}

carregarComparativo();
</script>
</body>
</html>
