<!doctype html>
<html lang="pt-BR" data-critters-container>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Indicadores SIMAQ - Sistema de Monitoramento">
        <title>Indicadores SIMAQ</title>
        <base href="./">
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
        <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
        <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
        <style type="text/css">
            *, *::before, *::after { box-sizing: border-box; }
            body, html {
                height: 100%;
                font-family: 'DM Sans', sans-serif;
                margin: 0;
                background-color: #f0f4f5;
                color: #38464D;
            }
            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                background: #fff;
                border-bottom: 3px solid #19b8b0;
                box-shadow: 0 2px 8px rgba(0,0,0,.07);
                padding: 14px 28px;
                gap: 20px;
            }
            .header-left { flex: 1; }
            .header-left h2 {
                font-family: 'Syne', sans-serif;
                font-size: 1.5rem;
                font-weight: 800;
                color: #38464D;
                margin: 0 0 2px 0;
                letter-spacing: -0.01em;
            }
            .header-left p {
                font-family: 'DM Sans', sans-serif;
                font-size: 0.9rem;
                color: #6b7f86;
                margin: 0;
                font-weight: 300;
            }
            .header-logos { display: flex; align-items: center; gap: 16px; }
            .logo {
                height: 58px;
            }
            .content {
                display: flex;
                margin-top: 20px;
                gap: 20px;
                flex-wrap: wrap;
            }
            .chart-container {
                flex: 1;
                min-width: 400px;
                border: 1px solid #dde4e6;
                padding: 24px 20px;
                background-color: white;
                border-radius: 10px;
            }
            .chart-container h4 {
                font-family: 'DM Sans', sans-serif;
                font-size: 0.95rem;
                font-weight: 500;
                color: #555;
                margin: 0 0 14px 0;
            }
            .kpi-container {
                display: flex;
                gap: 16px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }
            .kpi-box {
                flex: 1;
                min-width: 200px;
                padding: 20px 16px;
                border-radius: 12px;
                text-align: center;
                color: #fff;
            }
            .kpi-box:nth-child(1) { background: #19b8b0; }
            .kpi-box:nth-child(2) { background: #1a7a6e; }
            .kpi-box h5 {
                font-family: 'DM Sans', sans-serif;
                font-size: 0.85rem;
                font-weight: 400;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                margin: 0 0 8px 0;
                opacity: 0.9;
                color: #fff;
            }
            .kpi-box p {
                font-family: 'Syne', sans-serif;
                font-size: 2rem;
                font-weight: 800;
                color: #fff;
                margin-bottom: 0;
            }
            .kpi-box .kpi-label {
                font-family: 'DM Sans', sans-serif;
                font-size: 12px;
                opacity: 0.8;
            }
            /* loading screen (lean style) */
            #loading-screen {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 9999;
                background: rgba(38,50,56,.45);
                backdrop-filter: blur(2px);
                align-items: center;
                justify-content: center;
            }
            #loading-screen.active { display: flex; }
            .loader-ring {
                position: relative;
                width: 180px;
                height: 180px;
            }
            .loader-ring svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                animation: spin 1.1s linear infinite;
            }
            .loader-ring svg circle {
                fill: none;
                stroke: #19b8b0;
                stroke-width: 4;
                stroke-linecap: round;
                stroke-dasharray: 200;
                stroke-dashoffset: 50;
            }
            .loader-ring img {
                position: absolute;
                inset: 0;
                margin: auto;
                width: 140px;
                height: 140px;
                object-fit: contain;
                border-radius: 50%;
                background: #fff;
                padding: 10px;
            }
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
    </head>
        <body style="width: 100%; padding: 0; background-color: #f0f4f5;">
        <div class="header">
            <div class="header-left">
                <h2>Indicadores SIMAQ</h2>
                <p>Painel de monitoramento de indicadores hospitalares</p>
            </div>
            <div style="display:flex; align-items:center; gap:16px;">
                <button id="back-button" style="font-family:'Syne',sans-serif; font-size:0.75rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; background:#19b8b0; color:#fff; border:none; border-radius:6px; padding:10px 20px; cursor:pointer; transition:background 0.2s; white-space:nowrap;" onmouseover="this.style.background='#007C6B'" onmouseout="this.style.background='#19b8b0'">
                    Voltar ao Início
                </button>
                <div class="header-logos">
                    <img src="/static/LOGO HM E SESA - NOVA (1).png" class="logo" alt="Logo">
                </div>
            </div>
        </div>
        <div style="padding: 0 28px 28px;">

        <!-- Filtros -->
        <div class="filters" style="display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-top: 0; margin-bottom: 20px; background-color: white; padding: 16px 20px; border-radius: 10px; border: 1px solid #dde4e6; flex-wrap: wrap;">
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div class="filter-group" style="display: flex; flex-direction: column; align-items: center; min-width: 150px;">
                    <label for="data-inicial">Data Inicial:</label>
                    <input type="date" id="data-inicial" value="{{ data_inicial }}" style="padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; width: 100%;">
                </div>
                <div class="filter-group" style="display: flex; flex-direction: column; align-items: center; min-width: 150px;">
                    <label for="data-final">Data Final:</label>
                    <input type="date" id="data-final" value="{{ data_final }}" style="padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; width: 100%;">
                </div>
                <div class="filter-group" style="display: flex; flex-direction: column; align-items: center; min-width: 150px;">
                    <label for="tipo">Tipo:</label>
                    <select id="tipo" style="padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; width: 100%;">
                        <option value="todos">Todos</option>
                    </select>
                </div>
                <div class="filter-group" style="display: flex; flex-direction: column; align-items: center; min-width: 150px;">
                    <label for="indicador">Indicador:</label>
                    <select id="indicador" style="padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 4px; width: 100%;">
                        {% for indicador in indicadores %}
                        <option value="{{ indicador }}">{{ indicador }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="chart-container" style="min-width: 100px; text-align: center; padding: 10px;">
                <h4 style="margin: 0; font-size: 16px;">Média do Indicador</h4>
                <div id="media-indicador" style="font-size: 20px; font-weight: bold; color: #19b8b0;">
                    {{ "{:,.2f}".format(media_periodo) }}
                </div>
            </div>
        </div>

        <div class="content">
            <div class="chart-container">
                <h4>Resultado Mensal com Meta</h4>
                <div id="bar-line-chart"></div>
            </div>
        </div>
        </div><!-- /.inner-wrapper -->

        <script>
            // Esconde loading screen ao restaurar do bfcache
            window.addEventListener('pageshow', function (e) {
                const ls = document.getElementById('loading-screen');
                if (ls) { ls.style.display = 'none'; }
            });

            // Mostrar a tela de carregamento ao clicar no botão "Voltar para o Início"
            document.getElementById('back-button').addEventListener('click', (event) => {
                event.preventDefault();
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.display = 'flex';
                    setTimeout(() => loadingScreen.classList.add('active'), 10);
                }
                setTimeout(() => {
                    window.location.href = '/';
                }, 1200);
            });

            // Cria o elemento de loading screen no estilo lean
            document.addEventListener('DOMContentLoaded', () => {
                const loadingScreen = document.createElement('div');
                loadingScreen.id = 'loading-screen';
                loadingScreen.innerHTML = `
                    <div class="loader-ring">
                        <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40"/></svg>
                        <img src="/static/LOGO HM - NOVA (1).png" alt="Carregando...">
                    </div>
                `;
                document.body.appendChild(loadingScreen);
            });

            // Dados carregados do Flask
            const dadosIndicadores = JSON.parse('{{ dados_json|tojson|safe }}') || [];
            const metasMensais = JSON.parse('{{ metas_json|tojson|safe }}') || [];

            // Função para calcular e atualizar a média do indicador selecionado
            function atualizarMediaIndicador(indicadorSelecionado, dataInicial, dataFinal) {
                const dadosFiltrados = dadosIndicadores.filter(item => {
                    const dataItem = new Date(item['Mês']);
                    return item['Indicador'] === indicadorSelecionado &&
                           dataItem >= new Date(dataInicial) &&
                           dataItem <= new Date(dataFinal);
                });

                const total = dadosFiltrados.reduce((sum, item) => sum + item['Quantidade'], 0);
                const media = dadosFiltrados.length > 0 ? total / dadosFiltrados.length : 0;

                document.getElementById('media-indicador').textContent = media.toLocaleString('pt-BR', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

                return media; // Retornar a média para uso no gráfico
            }

            // Função para filtrar os últimos 12 meses
            function definirDatasPadrao() {
                const hoje = new Date();
                const dataFinal = hoje.toISOString().split('T')[0]; // Data final é hoje
                const dataInicial = new Date(hoje.getFullYear(), hoje.getMonth() - 11, 1).toISOString().split('T')[0]; // Últimos 12 meses

                document.getElementById('data-inicial').value = dataInicial;
                document.getElementById('data-final').value = dataFinal;
            }

            // Atualizar os tipos com base no indicador selecionado
            function atualizarTipos(indicadorSelecionado) {
                const tiposRelacionados = [...new Set(
                    dadosIndicadores
                        .filter(item => item['Indicador'] === indicadorSelecionado)
                        .map(item => item['Tipo'])
                )];

                const tipoSelect = document.getElementById('tipo');
                tipoSelect.innerHTML = ''; // Limpar opções existentes

                tiposRelacionados.forEach(tipo => {
                    const option = document.createElement('option');
                    option.value = tipo;
                    option.textContent = tipo;
                    tipoSelect.appendChild(option);
                });

                // Adicionar a opção "Todos" no início
                const optionTodos = document.createElement('option');
                optionTodos.value = 'todos';
                optionTodos.textContent = 'Todos';
                tipoSelect.insertBefore(optionTodos, tipoSelect.firstChild);
            }

            // Função para criar o gráfico de barras com linha de meta e linha de média
            function criarGraficoBarraLinha(indicadorSelecionado) {
                const dataInicial = document.getElementById('data-inicial').value;
                const dataFinal = document.getElementById('data-final').value;

                const dadosFiltrados = dadosIndicadores.filter(item => {
                    const dataItem = new Date(item['Mês']);
                    return item['Indicador'] === indicadorSelecionado &&
                           dataItem >= new Date(dataInicial) &&
                           dataItem <= new Date(dataFinal);
                });

                // Garante que os meses estejam ordenados e únicos
                const meses = [...new Set(dadosFiltrados.map(item => item['Mês']))].sort();

                // Para cada mês, pega o resultado e a meta (meta pode ser 0)
                const resultados = meses.map(mes => {
                    const item = dadosFiltrados.find(i => i['Mês'] === mes);
                    return item ? item['Quantidade'] : 0;
                });

                // Trazer sempre a meta do indicador para cada mês, mesmo que seja 0
                const metas = meses.map(mes => {
                    const meta = metasMensais.find(meta => meta['Indicador'] === indicadorSelecionado && meta['Mês'] === mes);
                    return meta ? meta['Meta'] : 0;
                });

                // Calcular a média para o indicador selecionado
                const media = atualizarMediaIndicador(indicadorSelecionado, dataInicial, dataFinal);
                const linhaMedia = Array(meses.length).fill(media);

                // valores no formato brasileiro (até 2 casas: há indicadores em taxa)
                const fmt = v => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 2 });

                // Resultado mês a mês, com o valor escrito dentro de cada barra
                const traceBarras = {
                    x: meses,
                    y: resultados,
                    type: 'bar',
                    name: 'Resultado',
                    marker: { color: '#19b8b0' },
                    text: resultados.map(fmt),
                    textposition: 'inside',
                    insidetextanchor: 'middle',
                    textfont: { color: '#fff', size: 12 },
                    hovertemplate: 'Resultado: %{text}<extra></extra>'
                };

                const traces = [traceBarras];

                // Linha de meta: só nos meses com meta diferente de 0 (os demais
                // ficam vazios); sem nenhuma meta no período, a linha não aparece.
                // O valor é escrito no primeiro mês e sempre que a meta muda.
                const metasVisiveis = metas.map(m => (m && Number(m) !== 0) ? Number(m) : null);
                if (metasVisiveis.some(m => m !== null)) {
                    traces.push({
                        x: meses,
                        y: metasVisiveis,
                        type: 'scatter',
                        mode: 'lines+markers+text',
                        name: 'Meta',
                        line: { color: '#FF5733', width: 2 },
                        text: metasVisiveis.map((m, i) => {
                            if (m === null) return '';
                            const anterior = metasVisiveis.slice(0, i).reverse().find(v => v !== null);
                            return anterior === undefined || anterior !== m ? `Meta: ${fmt(m)}` : '';
                        }),
                        textposition: 'top center',
                        textfont: { color: '#FF5733', size: 12 },
                        customdata: metasVisiveis.map(m => m === null ? '' : fmt(m)),
                        hovertemplate: 'Meta: %{customdata}<extra></extra>',
                    });
                }

                // Linha de média: valor na legenda e escrito uma vez, no fim da linha
                traces.push({
                    x: meses,
                    y: linhaMedia,
                    type: 'scatter',
                    mode: 'lines+text',
                    name: `Média: ${fmt(media)}`,
                    line: { color: '#1E90FF', dash: 'dot', width: 2 },
                    text: linhaMedia.map((_, i) => i === linhaMedia.length - 1 ? `Média: ${fmt(media)}` : ''),
                    textposition: 'top left',
                    textfont: { color: '#1E90FF', size: 12 },
                    hovertemplate: `Média: ${fmt(media)}<extra></extra>`
                });

                // folga no topo para os valores escritos não serem cortados
                const maiorValor = Math.max(0, ...resultados, ...metasVisiveis.filter(m => m !== null), media);
                const layout = {
                    title: `Resultado Mensal com Meta e Média - Indicador: ${indicadorSelecionado}`,
                    xaxis: { title: 'Mês' },
                    yaxis: { title: 'Quantidade', range: [0, (maiorValor || 1) * 1.18] },
                    separators: ',.',
                    hovermode: 'x unified',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    barmode: 'group'
                };

                Plotly.newPlot('bar-line-chart', traces, layout);
            }

            // Atualizar o gráfico, a média e os tipos ao mudar o indicador
            document.getElementById('indicador').addEventListener('change', () => {
                const indicadorSelecionado = document.getElementById('indicador').value;
                atualizarTipos(indicadorSelecionado);
                criarGraficoBarraLinha(indicadorSelecionado);
            });

            document.getElementById('data-inicial').addEventListener('change', () => {
                const indicadorSelecionado = document.getElementById('indicador').value;
                criarGraficoBarraLinha(indicadorSelecionado);
            });

            document.getElementById('data-final').addEventListener('change', () => {
                const indicadorSelecionado = document.getElementById('indicador').value;
                criarGraficoBarraLinha(indicadorSelecionado);
            });

            // Inicializar gráficos, tipos, datas e média
            document.addEventListener('DOMContentLoaded', () => {
                definirDatasPadrao(); // Definir datas padrão para os últimos 12 meses
                const indicadorInicial = document.getElementById('indicador').value;
                atualizarTipos(indicadorInicial);
                criarGraficoBarraLinha(indicadorInicial);
            });
        </script>
    </body>
</html>
